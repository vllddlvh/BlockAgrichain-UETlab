version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: blockagrichain-db
    restart: always
    environment:
      POSTGRES_DB: traceability_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: phuong4404
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Map các file script init DB vào thư mục chạy tự động của PostgreSQL
      # Chú ý: Docker chạy file theo thứ tự bảng chữ cái nên mình đổi tên lúc mount để chạy đúng thứ tự
      - ./Blockagrichain-Database/traceability_system.sql:/docker-entrypoint-initdb.d/01_traceability_system.sql
      - ./Blockagrichain-Database/migrate_blockchain_anchor_columns.sql:/docker-entrypoint-initdb.d/02_migrate_blockchain_anchor_columns.sql
      - ./Blockagrichain-Database/seed_data2.sql:/docker-entrypoint-initdb.d/03_seed_data2.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d traceability_system"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./Blockagrichain-Backend
      dockerfile: Dockerfile
    container_name: blockagrichain-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      # Ghi đè cấu hình URL của database trong application.yaml để trỏ vào container db thay vì localhost
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/traceability_system
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=phuong4404
      - BLOCKCHAIN_RPC_URL=http://blockchain:8545
    depends_on:
      db:
        condition: service_healthy
      blockchain:
        condition: service_started

  blockchain:
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    container_name: blockagrichain-blockchain
    restart: always
    ports:
      - "8545:8545"

  frontend:
    build:
      context: ./Blockagridence-Frontend/blockagridence-fe
      dockerfile: Dockerfile
    container_name: blockagrichain-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
